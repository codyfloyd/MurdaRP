<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MURDARP | FiveM Community</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Pulse animation for the Live indicator */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .live-pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">MURDA<span>RP</span></div>
        <ul>
            <li><a href="index.html" class="active">HOME</a></li>
            <li><a href="rules.html">RULES</a></li>
            <li><a href="features.html">FEATURES</a></li>
            <li><a href="keybinds.html">KEYBINDS</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="https://discord.gg/ZNHt8J7569">DISCORD</a></li>
        </ul>
    </nav>

    <header id="home">
        <div class="hero-content">
            <p class="pre-title" style="color: #cc0000; letter-spacing: 5px; font-weight: bold;">ESTABLISHED IN THE TRENCHES</p>
            <h1>OWN THE<span>STREETS</span></h1>
            <div class="hero-btns">
                <a href="fivem://connect/exdjk3" class="btn-main">JOIN SERVER</a>
                <a href="rules.html" class="btn-secondary">READ RULES</a>
            </div>
        </div>
    </header>

    <section id="info">
        <div class="card">
            <span class="card-tag">SYSTEM STATUS</span>
            <h3 id="op-status">CHECKING...</h3>
            <p id="status">CONNECTING ●</p>
        </div>
        <div class="card">
            <span class="card-tag">POPULATION</span>
            <h3>CIVILIANS</h3>
            <p id="player-count">-- / --</p>
        </div>
        <div class="card">
            <span class="card-tag">GANGS</span>
            <h3>ACTIVE GANGS</h3>
            <p>3</p>
        </div>
    </section>

    <footer></footer>

<script>
    const serverID = 'exdjk3'; 
    // Using AllOrigins as it's the most stable public proxy for Cfx.re
    const proxy = "https://api.allorigins.win/get?url="; 
    const targetUrl = `https://servers-frontend.cfx.re/api/servers/single/${serverID}`;

    async function updateServerStats() {
        const statusEl = document.getElementById('status');
        const countEl = document.getElementById('player-count');
        const opStatus = document.getElementById('op-status');

        try {
            const response = await fetch(`${proxy}${encodeURIComponent(targetUrl)}`);
            if (!response.ok) throw new Error('Proxy Unreachable');
            
            const wrapper = await response.json();
            // AllOrigins wraps the result in a .contents string
            const data = JSON.parse(wrapper.contents);
            
            if (data && data.Data) {
                // Determine current players (FiveM API can be inconsistent)
                const current = data.Data.clients !== undefined ? data.Data.clients : 
                               (data.Data.players ? data.Data.players.length : 0);
                
                const max = data.Data.sv_maxclients || "64";

                // Update Player Count
                countEl.innerText = `${current} / ${max}`;
                
                // Update Visual Status
                opStatus.innerText = "OPERATIONAL";
                statusEl.innerText = "LIVE ●";
                statusEl.style.color = "#00ff44";
                statusEl.style.textShadow = "0 0 10px rgba(0, 255, 68, 0.6)";
                statusEl.classList.add('live-pulse');
            } else {
                throw new Error('Invalid Data Received');
            }
        } catch (e) {
            console.error("FiveM Fetch Failed:", e);
            opStatus.innerText = "OFFLINE";
            statusEl.innerText = "OFFLINE ●";
            statusEl.style.color = "#cc0000";
            statusEl.style.textShadow = "none";
            statusEl.classList.remove('live-pulse');
            countEl.innerText = "0 / 0";
        }
    }

    // Run on load
    updateServerStats();
    // Refresh every 60 seconds to avoid proxy rate limits
    setInterval(updateServerStats, 60000);
</script>
</body>
</html>
