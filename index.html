<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MurdaRP | FiveM Roleplay</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#dc2626",
            dark: "#050505",
            gunmetal: "#0d0d0d",
          },
          boxShadow: {
            redglow: "0 0 30px rgba(220,38,38,0.45)",
          },
        }
      }
    }
  </script>

  <style>
    html { scroll-behavior: smooth; }

    /* Animated red grid background */
    .grid-bg {
      background-image: linear-gradient(rgba(220,38,38,0.12) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(220,38,38,0.12) 1px, transparent 1px);
      background-size: 45px 45px;
      animation: gridMove 14s linear infinite;
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 45px 45px; }
    }
  </style>
</head>

<body class="bg-dark text-gray-200 font-sans">

  <!-- FLOATING LOGO TOP RIGHT -->
  <img src="assets/mrp.png"
       alt="MurdaRP Logo"
       class="fixed top-6 right-6 z-50 w-20 h-auto pointer-events-none select-none">

  <!-- HERO SECTION -->
  <section class="min-h-screen grid-bg flex flex-col items-center justify-center px-6 py-20">

    <!-- Branding -->
    <div class="text-center max-w-3xl">

      <h1 class="text-6xl md:text-7xl font-extrabold tracking-widest text-white uppercase drop-shadow-[0_0_12px_rgba(220,38,38,0.45)]">
        Murda<span class="text-primary">RP</span>
      </h1>

      <p class="mt-6 text-gray-400 text-lg leading-relaxed max-w-2xl mx-auto">
        A ruthless, high‑stakes FiveM city built on creativity, consequences, and criminal empire storytelling.
        This isn’t casual RP — this is survival.
      </p>

      <!-- Buttons -->
      <div class="mt-10 flex flex-col sm:flex-row justify-center gap-6">

        <!-- CONNECT BUTTON -->
        <a href="fivem://connect/45.141.24.234:30120"
           class="bg-primary text-white px-12 py-4 rounded-xl font-bold text-xl tracking-wide shadow-redglow hover:bg-red-700 transition text-center">
          CONNECT NOW
        </a>

        <!-- DISCORD BUTTON -->
        <a href="https://discord.gg/NyTC6mpNwR" target="_blank"
           class="bg-white text-primary px-12 py-4 rounded-xl font-bold text-xl tracking-wide border border-white hover:bg-gray-200 transition text-center">
          JOIN DISCORD
        </a>

      </div>
    </div>

    <!-- SERVER STATUS PANEL (MOBILE-FRIENDLY) -->
    <div class="mt-12 md:absolute md:bottom-10 md:right-10 bg-gunmetal border border-red-900/40 p-6 rounded-xl shadow-redglow w-full max-w-sm md:w-72">
      <h3 class="text-lg font-bold text-primary tracking-wide">SERVER STATUS</h3>

      <div class="mt-4 space-y-3 text-sm font-semibold">
        <div class="flex justify-between">
          <span class="text-gray-400">Status</span>
          <span id="server-status" class="text-red-500">Offline</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-400">Players</span>
          <span id="player-count">0 / 60</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-400">Framework</span>
          <span class="text-gray-300">QBCore</span>
        </div>
      </div>
    </div>

  </section>

  <!-- SERVER STATUS SCRIPT -->
  <script>
    async function updatePlayerCount() {
      const playerEl = document.getElementById("player-count");
      const statusEl = document.getElementById("server-status");

      try {
        const res = await fetch("http://45.141.24.234:30120/players.json");
        const data = await res.json();

        playerEl.textContent = `${data.length} / 60`;
        statusEl.textContent = "Online";
        statusEl.classList.remove("text-red-500");
        statusEl.classList.add("text-green-400");
      } catch {
        playerEl.textContent = "0 / 60";
        statusEl.textContent = "Offline";
        statusEl.classList.remove("text-green-400");
        statusEl.classList.add("text-red-500");
      }
    }

    updatePlayerCount();
    setInterval(updatePlayerCount, 10000);
  </script>

</body>
</html>
