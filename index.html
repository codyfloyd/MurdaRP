<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MURDARP | FiveM Community</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">MURDA<span>RP</span></div>
        <ul>
            <li><a href="index.html" class="active">HOME</a></li>
            <li><a href="rules.html">RULES</a></li>
            <li><a href="features.html">FEATURES</a></li>
            <li><a href="keybinds.html">KEYBINDS</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="https://discord.gg/ZNHt8J7569">DISCORD</a></li>
        </ul>
    </nav>

    <header id="home">
        <div class="hero-content">
            <p class="pre-title" style="color: #cc0000; letter-spacing: 5px; font-weight: bold;">ESTABLISHED IN THE TRENCHES</p>
            <h1>OWN THE<span>STREETS</span></h1>
            <div class="hero-btns">
                <a href="fivem://connect/exdjk3" class="btn-main">JOIN SERVER</a>
                <a href="rules.html" class="btn-secondary">READ RULES</a>
            </div>
        </div>
    </header>

    <section id="info">
        <div class="card">
            <span class="card-tag">SYSTEM STATUS</span>
            <h3>OPERATIONAL</h3>
            <p id="status">CONNECTING ●</p>
        </div>
        <div class="card">
            <span class="card-tag">POPULATION</span>
            <h3>CIVILIANS</h3>
            <p id="player-count">-- / --</p>
        </div>
        <div class="card">
            <span class="card-tag">GANGS</span>
            <h3>ACTIVE GANGS</h3>
            <p>3</p>
        </div>
    </section>

    <footer></footer>

    <script>
        const serverID = 'exdjk3'; 
        async function updateServerStats() {
            try {
                const response = await fetch(`https://servers-frontend.cfx.re/api/servers/single/${serverID}`);
                const data = await response.json();
                if (data && data.Data) {
                    document.getElementById('player-count').innerText = `${data.Data.clients} / ${data.Data.sv_maxclients}`;
                    const statusEl = document.getElementById('status');
                    statusEl.innerText = "LIVE ●";
                    statusEl.style.color = "#00ff44";
                }
            } catch (e) {
                document.getElementById('status').innerText = "OFFLINE ●";
                document.getElementById('status').style.color = "#cc0000";
            }
        }
        updateServerStats();
        setInterval(updateServerStats, 60000);
    </script>
</body>
</html>
